name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never runs on pull_request — keeps write tokens off untrusted PR code.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build package
        run: npm run prepare

      - name: Build example
        run: npm run example:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
